name: CI (Lint, Format, Type Check)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Print Ty and BeautifulSoup versions
      run: |
        echo "Ty version:"
        uv run ty version
        echo "BeautifulSoup4 version:"
        uv run python -c "import bs4; print(bs4.__version__)"
        echo "Types-BeautifulSoup4 version:"
        uv run pip list | grep types-beautifulsoup4 || echo "types-beautifulsoup4 not found or grep failed"


    - name: Run Ruff Check (Linting)
      run: uv run ruff check .

    - name: Run Ruff Format Check
      run: uv run ruff format . --check

    - name: Run Type Check (ty)
      run: uv run ty check
